<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="mb-4">
Admin Dashboard
</h2>

<h4>Registered Users</h4>

<table class="table table-bordered">

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

</tr>

{% for user in users %}

<tr>

<td>{{ user.id }}</td>

<td>{{ user.fullname }}</td>

<td>{{ user.email }}</td>

</tr>

{% endfor %}

</table>

<hr>

<h4>Incident Reports</h4>

<table class="table table-bordered">

<tr>

<th>Name</th>

<th>Location</th>

<th>Details</th>

</tr>

{% for report in reports %}

<tr>

<td>{{ report.name }}</td>

<td>{{ report.location }}</td>

<td>{{ report.details }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
